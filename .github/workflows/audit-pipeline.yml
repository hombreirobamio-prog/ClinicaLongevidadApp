name: Audit pipeline
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Record start
        run: |
          "AUDIT_RUN_START=$([datetime]::UtcNow.ToString('o'))" >> $env:GITHUB_ENV
      - name: Restore
        run: dotnet restore ClinicaLongevidadApp.Tests/ClinicaLongevidadApp.Tests.csproj
      - name: Tests
        env:
          AUDIT_RECOVERY_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/ci-recovery
        run: dotnet test ClinicaLongevidadApp.Tests/ClinicaLongevidadApp.Tests.csproj --no-restore --configuration Release --logger 'trx;LogFileName=tests.trx' --results-directory artifacts/ci-test-results
      - name: Build scheduled backup runner
        run: |
          dotnet restore tools/ScheduledBackup/ScheduledBackup.csproj
          dotnet build tools/ScheduledBackup/ScheduledBackup.csproj --configuration Release --no-restore
          dotnet run --project tools/ScheduledBackup/ScheduledBackup.csproj --configuration Release --no-build -- --help
      - name: Manifest and package regression
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test_audit_manifest.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test_audit_package.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-test-results
          path: artifacts/ci-test-results/*.trx
          if-no-files-found: error
      # Signing secrets are never available to pull-request code.
      - name: Preserve synthetic recovery reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-recovery-reports
          path: artifacts/ci-recovery/**/recovery-result.json
          if-no-files-found: error
      - name: Build authenticated technical package
        if: github.event_name != 'pull_request'
        id: package
        env:
          AUDIT_HMAC_KEY: ${{ secrets.AUDIT_PACKAGE_HMAC_KEY }}
          AUDIT_HMAC_KEY_VERSION: ${{ vars.AUDIT_PACKAGE_HMAC_KEY_VERSION }}
        run: |
          $zip = & ./scripts/generate_audit_artifacts.ps1 -TestResultsPath artifacts/ci-test-results/tests.trx -RunStartedUtc $env:AUDIT_RUN_START
          "zip=$zip" >> $env:GITHUB_OUTPUT
      - name: Preserve authenticated package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: audit-technical-package
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
